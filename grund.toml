grund_config_version = 2
project_name = "grund"

[schema]
marker = "§"
shorthand = "canonical"
# Slug-only IDs — see FS-config.3.2. Slugs must be unique within a kind.
# Slug must start with a letter: a marked digit-led token such as `FS-001` is an
# off-format-citation error, so an illustration in another format is `<§>FS-001`.
id_format = "{kind}-{slug}"
slug_pattern = "[a-z][a-z0-9-]*"
number_pattern = "\\d+"
section_separator = "."
heading_depth = "must"

[schema.sources]
languages = ["v1_markdown", "v1_c_family", "v1_go", "v1_python", "v1_ruby", "v1_lisp", "v1_sql", "v1_haddock", "v1_ldoc", "v1_plain", "v1_shell"]
declarations = "any-comment"
# `repo` / `expected.repo`: the e2e fixture trees under `tests/e2e/cases/*/` are
# test inputs, not this project's code — keep them out of the host scan so strict
# mode and `[rules.citations.grounding]` (below) apply to grund's own sources, not
# the fixtures. With `e2e` a plain home rather than the `E2E` case kind, this exclude
# is the only thing between the walk and the fixtures.
exclude = ["target/", "node_modules/", ".git/", "dist/", "build/", ".venv/", "repo/", "expected.repo/", "assets/"]
respect_gitignore = true

# The allowlist of what the walk reads — the opposite sense of `exclude` above: a
# file is scanned only when its extension is listed (FS-config.3.5). `sh` is here
# for the shell scripts under `scripts/`.
[schema.sources.extensions]
md = "v1_markdown"
rs = "v1_c_family"
go = "v1_go"
java = "v1_c_family"
kt = "v1_c_family"
ts = "v1_c_family"
tsx = "v1_c_family"
js = "v1_c_family"
py = "v1_python"
c = "v1_c_family"
cpp = "v1_c_family"
swift = "v1_c_family"
scala = "v1_c_family"
rb = "v1_ruby"
php = "v1_c_family"
cs = "v1_c_family"
lisp = "v1_lisp"
scm = "v1_lisp"
clj = "v1_lisp"
sql = "v1_sql"
hs = "v1_haddock"
lhs = "v1_haddock"
lua = "v1_ldoc"
ada = "v1_plain"
adb = "v1_plain"
ads = "v1_plain"
yml = "v1_plain"
yaml = "v1_plain"
sh = "v1_shell"

[schema.sources.definitions.v1_markdown]
class = "document"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.sources.definitions.v1_c_family]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "c-family"
docstrings = "off"

[schema.sources.definitions.v1_go]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "go"
docstrings = "off"

[schema.sources.definitions.v1_python]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "python"
docstrings = "python"

[schema.sources.definitions.v1_ruby]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "ruby"
docstrings = "off"

[schema.sources.definitions.v1_lisp]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "lisp"
docstrings = "off"

[schema.sources.definitions.v1_sql]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "sql"
docstrings = "off"

[schema.sources.definitions.v1_haddock]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "haddock"
docstrings = "off"

[schema.sources.definitions.v1_ldoc]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "ldoc"
docstrings = "off"

[schema.sources.definitions.v1_plain]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.sources.definitions.v1_shell]
class = "source"
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
doc_comments = "shell"
docstrings = "off"

[schema.notes.lines]
must = 3
may = 1

[schema.notes.columns]
must = 100

[schema.notes.text]
must = true

[schema.kinds.GRUND]
files = ["docs/grund.md"]

[schema.kinds.GOAL]
files = ["docs/goals.md"]

[schema.kinds.FS]
folders = ["docs/functional-spec"]

# Every FS opens with its Terms chapter (FS-fields). RULE-terms stays beside the
# field: the rule counts chapters titled Terms, the field holds the one named
# `terms` to its place and title, and an absence is reported once, as the
# field's finding (DISC-core-concerns.10.2).
[schema.kinds.FS.fields.terms]
title = "Terms"
presence = "must"
position = "first"

[schema.kinds.REQ]
folders = ["docs/requirements"]

[schema.kinds.AR]
folders = ["docs/architecture"]

# Every AR page opens with the chapter that names its box in AR-system, then its
# Terms chapter (AR-system.5). Each page titles its placement chapter for
# itself ("Where the scanner sits"), so that field sets no title.
[schema.kinds.AR.fields.placement]
presence = "must"
position = "first"

[schema.kinds.AR.fields.terms]
title = "Terms"
presence = "must"
after = "placement"

# DF before DA, matching the canonical default kind order (FS-config.3.4,
# crates/grund-core/assets/templates/software-development/grund.toml).
[schema.kinds.DF]
folders = ["docs/decisions/functional"]

# A decision record opens with its status, one of the two values records use:
# a record merges once accepted, and one replaced says so. `must`, raised once
# no record was left without it (DISC-core-concerns.10.2).
[schema.kinds.DF.fields.status]
one_of = ["Accepted", "Superseded"]
presence = "must"
position = "first"

[schema.kinds.DA]
folders = ["docs/decisions/architectural"]

# The same status as DF records (DISC-core-concerns.10.2).
[schema.kinds.DA.fields.status]
one_of = ["Accepted", "Superseded"]
presence = "must"
position = "first"

# The two test homes are places, not ID namespaces (FS-config.3.4.1,
# FS-config.3.4.4): a test cites the document whose claim it proves and is never
# cited back. The e2e corpus is `tests/e2e/cases/<case>/`, one fixture repository
# plus goldens per case; the harness in crates/grund-cli/tests/e2e.rs runs it and
# carries the per-case form of `must cite FS`, because `spec.refs` is a manifest
# the scanner never reads. The integration home holds the proofs that span more
# than one part — LSP/CLI parity, frontend isolation, CI/pre-commit parity — as
# a workspace member of its own, so Cargo builds them without a `[[test]] path`
# that would reach out of a published crate; tests/integration/README.md lists
# them.
[schema.kinds.e2e]
folders = ["tests/e2e"]
citable = false

[schema.kinds.integration]
folders = ["tests/integration"]
citable = false

[schema.kinds.RM]
files = ["docs/roadmap.md"]

[schema.kinds.DISC]
folders = ["docs/discussions"]

[schema.kinds.RULE]
folders = ["docs/rules"]
form = "rule"

# One declaration per body of related work: what it is, where grund agrees with
# it, and where grund departs. Each is grund's own account of the work, written
# here, not a copy of someone else's text, so it is a plain authored folder.
[schema.kinds.REL]
folders = ["docs/related-work"]

# A place, not an ID namespace (FS-config.3.4.1): `skills/` holds agent-facing
# instructions, not specification, so its files declare nothing and its home is
# named by its path everywhere it is shown. Listed, not walked (FS-config.3.4.7),
# for the same reason `templates` below is: `grund guide`
# prints `grund-init/SKILL.md` and its `references/` byte-for-byte into a foreign
# repository (FS-init.5),
# so a citation here would ship as a dangling reference to a declaration that
# repository does not have (REQ-shipped-surfaces.2). Nothing in this directory is
# this repository's to check, and the row in the Project map is what an agent
# needs. There is no `[rules.citations.skill]` table below for the same reason —
# an unwalked kind cannot be a citing kind (FS-config.3.4.7).
[schema.kinds.skill]
folders = ["skills"]
citable = false
scan = false

# Four more places (FS-config.3.4.1), each named by its path in the Project map.
# `examples/` holds the user-facing walkthroughs FS-examples asks for, each
# shaped like an e2e case — `repo/` is the fixture, kept out of the scan by
# `[schema.sources] exclude` above, and the README beside it is what gets
# checked.
[schema.kinds.example]
folders = ["examples"]
citable = false

# The GitHub Actions workflows. Being a home is what scans them, so the `code`
# row below does not name the directory.
[schema.kinds.workflow]
folders = [".github/workflows"]
citable = false

# The hook checks, the release script, the benchmark tooling, and the PGO
# build. `sh` is in `[schema.sources.extensions]` above so the shell scripts
# here are checked beside the Python ones.
[schema.kinds.script]
folders = ["scripts"]
citable = false

# What `grund init` writes (FS-init.2.1): the one copy, which the binary embeds
# (FS-init.2.3.7) and `[schema.sources] exclude` keeps out through `assets`. Listed, not
# walked (FS-config.3.4.7): these files land verbatim in other repositories, so
# a citation in one would ship as a dangling reference — nothing here is this
# repository's to check, and the row in the Project map is what an agent needs.
[schema.kinds.template]
folders = ["crates/grund-core/assets/templates"]
citable = false
scan = false

[schema.kinds.readme]
files = ["README.md"]
citable = false

# README.md and AGENTS.md are cited surfaces too — scanned so their citations
# are checked, not decorative (REQ-readme.3, REQ-agents-md.4). README.md is the
# `readme` row's place; AGENTS.md is this one's. Every other home is walked by
# construction (FS-config.3.5), so the test homes, `examples`,
# `.github/workflows`, and `scripts` are not repeated here; `skills` and
# `templates` are homes too, and ones the config lists without walking.
[schema.kinds.code]
files = ["AGENTS.md"]
folders = ["docs", "crates", "tests/bindings"]

# Citation directions (FS-config.3.9, DF-citation-directions): must/must-not gate
# `grund check`; should/should-not surface under `grund check --suggestions`.
[rules.citations]
default = "may"

[rules.citations.GOAL]
should = ["GRUND|GOAL"]

[rules.citations.FS]
should = ["GOAL|FS"]
must-not = ["AR"]

# A hard requirement with no why is a preference, so every REQ names the ground
# it protects; and a promise that must outlive every rewrite of the
# implementation cannot be phrased in terms of it.
[rules.citations.REQ]
should = ["GRUND|GOAL"]
must-not = ["AR"]

[rules.citations.AR]
should = ["FS|GOAL"]

[rules.citations.DF]
should = ["FS|GOAL"]

[rules.citations.DA]
should = ["AR|FS"]

# A scenario proves the What as a user sees it; one that reads the design is not
# black-box. `must` reaches every scanned file in the home — the README — and the
# harness holds the same rule per case over `spec.refs`.
[rules.citations.e2e]
must = ["FS"]
should-not = ["AR"]

# An integration test proves the How: that the parts fit as designed.
[rules.citations.integration]
should = ["AR"]

[rules.citations.RULE]
should = ["FS|GOAL"]

# Where grund comes from is part of its why, so every related-work entry names
# the ground it bears on; an account of someone else's work that touches no
# GRUND or GOAL point is a survey, not this project's lineage.
[rules.citations.REL]
should = ["GRUND|GOAL"]

# An example is a user-facing walkthrough of the What, so it names the FS point
# it teaches and never the design.
[rules.citations.example]
must = ["FS"]
must-not = ["AR"]

# Workflows and scripts are implementation: the same rule as `code`.
[rules.citations.workflow]
should = ["FS|AR"]

[rules.citations.script]
should = ["FS|AR"]

[rules.citations.readme]
must-not = ["FS", "AR"] # the README sends a reader to the user guides, never into the specs

[rules.citations.code]
should = ["FS|AR"]

[rules.citations.grounding]
must = "file"

[presentation]
trigger = "$$"
conversation = "link"
rules = "root"

[presentation.kinds.GRUND]
title = "Why: project motivation"

[presentation.kinds.GOAL]
title = "Where: project direction and outcomes"

[presentation.kinds.FS]
title = "What: behavior, requirements, and constraints"

[presentation.kinds.REQ]
title = "Hard requirements: what grund must never break"

[presentation.kinds.AR]
title = "How: high-level implementation, structure, and design"

[presentation.kinds.DF]
title = "Product behavior decisions and tradeoffs"

[presentation.kinds.DA]
title = "Architecture decisions and tradeoffs"

[presentation.kinds.e2e]
title = "User scenarios: black-box proof of the spec"

[presentation.kinds.integration]
title = "Integration tests: proof that the parts fit as designed"

[presentation.kinds.RM]
title = "Planned milestones and sequencing"

[presentation.kinds.DISC]
title = "Design discussions and proposals"

[presentation.kinds.RULE]
title = "Executable conventions: the rules grund check holds this repository to"

[presentation.kinds.REL]
title = "Related work: the ideas grund descends from and the tools beside it"

[presentation.kinds.skill]
title = "Agent review and automation skills"

[presentation.kinds.example]
title = "Worked examples: user-facing walkthroughs that double as fixtures"

[presentation.kinds.workflow]
title = "CI and release workflows: the gate on GitHub, and how a release ships"

[presentation.kinds.script]
title = "Repository scripts: hook checks, release preparation, benchmarks, PGO build"

[presentation.kinds.template]
title = "Init scaffold templates: what grund init writes, verbatim"

[presentation.kinds.readme]
title = "The README: the shop window for users, which links the user guides and cites no spec"

# The complement row: its places are the ones v1's `[scan] include` named, and
# it also takes every scanned file no other row claims
# (FS-config-v2.schema.places.complement).
[presentation.kinds.code]
title = "The engine, CLI and bindings, and every scanned file no other row claims"

[presentation.fmt]
anchors = "github"
links = "index"
exclude = []
