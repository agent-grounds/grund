# §AR-ci.14: the macOS suites run once a day on main and are no gate, so no pull request
# or merge-queue group waits for them. A failed scheduled run opens or edits one issue.
name: macOS daily

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # §AR-ci.14.1: the suite job lives in macos-suites.yml, which ci.yml calls on a dispatch.
  macos:
    uses: ./.github/workflows/macos-suites.yml

  # §AR-ci.14.3: a failed scheduled run opens or edits the one macOS failure issue.
  report:
    name: report the failure
    needs: [macos]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Open or edit the macOS failure issue
        run: python3 scripts/macos_daily.py
