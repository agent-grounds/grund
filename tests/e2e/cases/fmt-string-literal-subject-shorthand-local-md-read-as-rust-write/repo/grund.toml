grund_config_version = 2
project_name = "fixture"

[schema]
id_format = "{kind}-{number}-{slug}"
number_pattern = "[0-9]{3}"
slug_pattern = "[a-z][a-z0-9-]*"

[schema.sources]
languages = ["markdown", "rust"]

[schema.sources.extensions]
md = "rust"

[schema.kinds.FS]
folders = ["fs"]
index = false
