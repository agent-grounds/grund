grund_config_version = 1
project_name = "heading-shorthand-anchor-e2e"

[reference]
strict = true
shorthand = "canonical"
require_grounding = false

[id]
format = "{kind}-{number}-{slug}"

[[kinds]]
kind = "FS"
folder = "docs/functional-spec"
index = false

[scan]
include = ["docs"]
extensions = ["md"]

[output]
relative_paths = true
