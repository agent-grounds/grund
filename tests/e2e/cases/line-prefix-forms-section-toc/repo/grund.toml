grund_config_version = 1

[[kinds]]
kind = "FS"
folder = "docs/functional-spec"
title = "What"

[[kinds]]
kind = "AR"
folder = "docs/architecture"
title = "How"

[reference]
strict = true

[id]
format = "{kind}-{slug}"
slug_pattern = "[a-z][a-z0-9-]*"

[scan]
include = ["docs", "src"]
extensions = ["md", "hs", "lua", "lisp"]
respect_gitignore = false
