# §AR-ci.14.1: the macOS suite job, written once and called by macos.yml on its schedule
# and by ci.yml on a dispatch (§AR-ci.14.2). It asks for nothing a caller cannot grant.
name: macOS suites

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # §AR-ci.13.6: no incremental state is written, so none reaches a cargo cache.
  CARGO_INCREMENTAL: 0
  # Treat rustc warnings as errors, as ci.yml does.
  RUSTFLAGS: "-D warnings"
  # §FS-distribution.3.0.3: corpus pipes carry UTF-8 on every host.
  PYTHONUTF8: "1"

jobs:
  # §AR-ci.14.1: one job runs every suite of §AR-ci.13.1, once.
  macos:
    name: suites (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # §FS-distribution.3.2.3.2: acceptance uses a supported Node major.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      # §FS-distribution.3.2.3.3: source builders require this pinned toolchain.
      - name: Install binding Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      # §AR-ci.13.4: the key names its job, so no job's save is lost to another's exact hit.
      # §AR-ci.3.4.4: a new key can save oracle dependencies missing from old exact hits.
      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
            ~/ag/tmp/grund-cochange-release-0.16.1
          key: ${{ runner.os }}-cargo-${{ github.job }}-oracle-v1-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      # §AR-ci.3.4.1: a key of its own, so the Node target is saved, not lost to the
      # cargo cache's exact hit; the builds write no incremental state into it.
      - name: Restore the Node acceptance's build target
        id: node-target
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/ag/tmp/grund-node-target
          key: ${{ runner.os }}-node-target-v3-1.95.0-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-target-v3-1.95.0-

      # §AR-ci.3.4.1.3: the pinned TypeScript compiler, under a key naming its version, so
      # the acceptance's one registry fetch happens only on a cache miss.
      - name: Restore the Node acceptance's TypeScript compiler
        id: node-typescript
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/ag/tmp/grund-node-target/tools/typescript-5.9.3
          key: ${{ runner.os }}-node-typescript-5.9.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # §FS-check.6.1.1, §AR-bindings.3: exercise actual native backends and
      # private lifecycle boundaries on Linux, macOS and Windows.
      - name: native watch contract
        run: python scripts/run_cargo_suite.py -p grund --features test-watch --test check_watch_observer --locked

      # The file-size ownership regression asks `fissile measure` for each split owner
      # (§AR-core-module-layout.1.5), so the binary is on PATH for the Python tests.
      - name: Install fissile
        run: cargo install fissile --version 0.8.3 --locked --quiet

      # §FS-distribution.3.0.3: build the shared oracle from the actual checkout,
      # including a PR merge checkout, before the Python gate runs.
      - name: Prepare same-source binding oracle
        run: python scripts/prepare_binding_oracle.py

      # §AR-ci.14.1: the four selections of the Python gate, one after another (§AR-ci.3.4.3).
      - name: python tests
        # §FS-cochange-recipe.examples: compatibility is mandatory, not environment-dependent.
        run: python scripts/run_python_gate.py --rest

      # §AR-ci.3.4.3: the Node acceptance alone, the longest test of the Python gate.
      - name: node acceptance
        run: python scripts/run_python_gate.py --only-node-acceptance

      # §AR-ci.3.4.3: the Python acceptance alone, every build of it in the shared target.
      - name: python acceptance
        run: python scripts/run_python_gate.py --only-python-acceptance

      # §AR-ci.3.4.3: the tests that build a release binary or run grund for minutes.
      - name: slow python tests
        run: python scripts/run_python_gate.py --only-slow

      - name: cargo build
        run: cargo build --quiet --workspace --all-targets --locked

      - name: grund self-check
        shell: bash
        run: |
          # `--full` (§FS-check.1.3) walks past `[scan] include` as well, so a citation this
          # repository's own config forgot to cover — examples/ is deliberately outside it —
          # fails CI instead of accumulating unseen.

          # The 30s ceiling is the catastrophic-regression guard (§AR-ci.4 /
          # §GOAL-fast-feedback); the `bench` job (§AR-benchmarks / §AR-ci.5) is the precise
          # meter. Python, not GNU `timeout`, so the same step runs on all three platforms.
          python - <<'PY'
          import subprocess
          import sys

          try:
              result = subprocess.run(
                  ["cargo", "run", "--quiet", "--locked", "--", "check", ".", "--format", "json", "--full"],
                  stdout=subprocess.PIPE,
                  timeout=30,
              )
          except subprocess.TimeoutExpired:
              print("grund self-check exceeded 30s", file=sys.stderr)
              sys.exit(124)

          if result.returncode != 0:
              sys.exit(result.returncode)
          if result.stdout:
              print("grund self-check wrote unexpected stdout:", file=sys.stderr)
              sys.stderr.buffer.write(result.stdout)
              sys.exit(1)
          PY

      # crates/grund-cli/tests/e2e.rs walks every fixture under tests/e2e/cases and asserts each case's
      # exit code, stdout, and stderr against its expected.* files; tests/init.rs
      # covers the file-content / config-validation contract for `grund init`. So
      # `cargo test` runs the full e2e suite plus the core and CLI unit tests.

      # §AR-ci.requirements.5.2: failures, a check-in each 5% and one summary, no line per test.
      # §AR-ci.14.1: every shard ci.yml runs, in turn; the first builds, the rest reuse it.
      - name: cargo test 1/4
        run: python scripts/run_cargo_suite.py --shard 1/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      - name: cargo test 2/4
        run: python scripts/run_cargo_suite.py --shard 2/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      - name: cargo test 3/4
        run: python scripts/run_cargo_suite.py --shard 3/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      - name: cargo test 4/4
        run: python scripts/run_cargo_suite.py --shard 4/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      # §AR-ci.14.1: only the scheduled call on main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
            ~/ag/tmp/grund-cochange-release-0.16.1
          key: ${{ runner.os }}-cargo-${{ github.job }}-oracle-v1-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}

      # §AR-ci.14.1: only the scheduled call on main saves, after the work, the key it missed.
      - name: Save the Node acceptance's build target
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.node-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/ag/tmp/grund-node-target
          key: ${{ runner.os }}-node-target-v3-1.95.0-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}

      # §AR-ci.3.4.1.3, §AR-ci.14.1: only the scheduled call on main saves, the key it missed.
      - name: Save the Node acceptance's TypeScript compiler
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.node-typescript.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/ag/tmp/grund-node-target/tools/typescript-5.9.3
          key: ${{ runner.os }}-node-typescript-5.9.3
