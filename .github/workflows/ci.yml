          key: ${{ runner.os }}-python-target-v1-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-target-v1-

      # §FS-distribution.3.0.3: build the shared oracle from the actual checkout,
      # including a PR merge checkout, before the Python gate runs.
      - name: Prepare same-source binding oracle
        run: python scripts/prepare_binding_oracle.py

      # §AR-ci.3.4.3: the Python acceptance alone, every build of it in the shared target.
      - name: python acceptance
        run: python scripts/run_python_gate.py --only-python-acceptance

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
            ~/ag/tmp/grund-cochange-release-0.16.1
          key: ${{ runner.os }}-cargo-${{ github.job }}-oracle-v1-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}

      # §AR-ci.3.4.5, §AR-ci.13.6: only a push to main saves, the key its restore missed;
      # the acceptance already dropped the workspace crates' own artifacts from it.
      - name: Save the Python acceptance's build target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.python-target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/ag/tmp/grund-python-target
          key: ${{ runner.os }}-python-target-v1-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}

  # `.pre-commit-config.yaml` is the local gate; CI runs it directly so every
  # pre-commit hook remains enforced remotely (§AR-ci.1), less the hooks whose command a
  # job above already runs (§AR-ci.13.3).
  pre-commit:
    name: pre-commit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # §AR-ci.3.1.4: the lychee hook diffs against LINK_BASE, which must be present.
          fetch-depth: 0

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with: { python-version: "3.x" }

      # §AR-ci.13.4: the key names its job, so no job's save is lost to another's exact hit.
      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      # Every binary a hook calls, in this job, before the hooks run (§AR-ci.1).
      - name: Install pre-commit hook dependencies
        run: |
          python -m pip install -q pre-commit
          cargo install lychee --version 0.23.0 --locked --quiet
          cargo install fissile --version 0.8.3 --locked --quiet

      # §AR-ci.3.1.4: a dispatch has no event base, and a fork's origin/main may be weeks
      # stale, so measure from the merge base with the upstream's main.
      - name: Resolve the link gate's base for a dispatch
        id: dispatch_base
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.clone_url // .clone_url' || true)
          # A crash prints nothing; `none` keeps that from falling back to the stale origin/main.
          base=$(python scripts/dispatch_link_base.py "$upstream" || true)
          echo "base=${base:-none}" >> "$GITHUB_OUTPUT"

      - name: pre-commit
        # lychee checks upwards of three thousand links, a large share of them
        # to github.com. Unauthenticated, they share a low per-IP budget with
        # every other job on the runner, and a handful come back 503 - which it
        # reports as "Rejected status code", reading like a dead link rather
        # than a throttle. The links were this repository's own documents, and
        # they resolved in a browser the whole time. lychee reads GITHUB_TOKEN
        # from the environment; the workflow-scoped one is enough, because the
        # point is the authenticated rate limit rather than access to anything
        # private.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # §AR-ci.3.1.2: the same token, as GH_TOKEN, which gh reads first, feeds
          # the hook's `gh api` re-check of a github.com 5xx.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # §AR-ci.3.1.4: the lychee hook requests only the external URLs on lines changed
          # since this base, the one the commit-messages job reads, or a dispatch's upstream
          # merge base; a push to main sets none.
          LINK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || steps.dispatch_base.outputs.base }}
          # §AR-ci.13.3: exactly the hooks whose command the Rust, Python and Node jobs run.
          SKIP: cargo-fmt-check,cargo-build,cargo-test,python-test
        run: pre-commit run --all-files

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
