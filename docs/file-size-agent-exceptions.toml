reason = """
One ordered release pipeline whose only real seam is a workflow_call workflow or a composite action. Extracting it today buys nothing and costs indirection across two files and a second place to look when a release fails at 2am — the move pays for itself once a second caller exists, and not before (§AR-ci).
"""
[[exceptions]]
path = "crates/grund-cli/src/cli_help.rs"
match = "exact"
rules = ["core-source"]
kind = "structural"
max_accepted = { value = 492, unit = "lines" }
until = "indefinite"
reason = """
The help screens are one user-facing document rendered per command, and their worth is consistency: the same section order, voice, and example style across the 12 command arms and the top-level page. That consistency is held by seeing them together. Scattering them beside their commands makes drift between screens the likeliest failure and produces no compile-time signal when it happens. The file is text, not logic: no state, no branching beyond the command match, nothing to test. Its length tracks the command surface, not accumulated logic: the ceiling moved 486 -> 488 because the one-per-agent rule (§FS-init.2.1.1) made the --claude line too long for a single println!, and 488 -> 492 when `grund init` gained `--check` (§FS-init.1) and the init screen owed it a usage token, an option line, an example, and the `1` in its `Exit:` line — which is one flag being described accurately rather than logic accruing.
"""
[[exceptions]]
path = "scripts/try-integrations.sh"
match = "exact"
rules = ["scripts"]
kind = "structural"
until = "indefinite"
max_accepted = { value = 461, unit = "lines" }
reason = """
A manual smoke script a human reads top to bottom while testing terminals by hand; its linearity is the feature, and functions would hide the sequence being followed. It is also run unattended now — `tests/integration/integrations_resolve.rs` drives its headless `resolve` mode as a gate — and that does not change the shape: the script stays one linear file by decision, so the entry is structural rather than deferred. The ceiling follows the file when a fix grows it, as the two `set -e` fixes of 2026-08-26 did.
"""
[[exceptions]]
path = "crates/grund-core/src/checker/tests_shorthand.rs"
match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 477, unit = "lines" }
until = "a third shorthand behaviour area earns its own module, the way the rewrite cases already did"
reason = """
The rewrite cases already left, to what is now `resolver/tests_shorthand_rewrite.rs` — that was the seam, and it is spent. What remains is one area: what `check` reports about a shorthand, plus the two surfaces that must agree with it (the CLI argument resolver and the LSP snapshot). These fail together — a change to the recognition boundary or the candidate rule breaks the report, the query, and the editor in one move — so a reader chasing one is chasing all three. A second cut here would be by fixture shape rather than by behaviour, which is the split the tests rule exists to prevent.

The ceiling moved 475 -> 477 when the file went beside the code it pins (§AR-core-module-layout.1): the seven-line import block a module charges, less the three `include!` wrapper lines it drops, and `cargo fmt --all` reaching the file for the first time now that it is a module rather than spliced in. No case changed.
"""

[[exceptions]]
