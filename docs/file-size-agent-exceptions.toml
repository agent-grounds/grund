[[exceptions]]
path = "crates/grund-core/src/config/v1/parse.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 422, unit = "lines" }
until = "extract the parser with its state made explicit, leaving discovery here"
reason = """
`parse_config_file` is a hand-written TOML reader: one line-oriented state machine over section and key context, correct only because every branch observes the same state. Splitting it by key group would thread that state through a wider interface, trading a long function for a worse one. Missing boundary: the parser as its own module with its state made explicit, leaving discovery here. This is the argument the hard entry in docs/file-size-human-exceptions.toml carried at 732 lines while the whole config category was one file; that entry retired when config became a Rust module (§AR-system.2.3) took the file to 499, under the hard budget. What left: the `[citations]` section for config/citations.rs with the rule records it fills, beside the `[[kinds]]` and grounding sections that were already their own files, and the `[scan]` defaults for config/record.rs beside the `Config` they start. The `[workspace]` section followed when workspace became a module (§AR-system.2.4) and the block's entry grammar came down to the reader that validates it — both member lists, the alias slug predicate and one entry point the reader calls, in config/workspace_block.rs — which took the file 499 -> 447. The `[fmt]` section went the same way when the writers became a module (§AR-system.2.8): the `exclude` glob compiler and the validator this reader refuses a malformed pattern with are config/fmt_block.rs, read downward instead of up through the crate root, which costs this file one import line and moves the ceiling 447 -> 448. The `inline_style` rejection then came to name its value and the accepted set (§FS-config.3.1.8), in the `format!` form its sibling enums use, which rustfmt wraps over three lines where the bare string took one, and that moves the ceiling 448 -> 450. Nothing of the state machine left, which is why the boundary is still named here. The additive structured configuration diagnostic (§FS-distribution.3.3.2) adds three net code lines at the existing bail_config source, now also used for integers; the exception rises 450 -> 453 to preserve the parser state machine and existing CLI text rather than split branches for the binding. The reader then moved to config/v1/parse.rs as the version-1 reader (§AR-config.2), lowering into the `Project` records rather than filling a `Config`; the meaning checks it ran after the line pass — the strict marker, the inline-note budget, the grounding pair, the member lists and the `[citations]` rules — left for config/validate.rs (§AR-config.4) and the grammar rebuild for config/compiled.rs, which takes the file 453 -> 422. The line pass itself is unchanged, which is why the boundary is still named here.
"""
