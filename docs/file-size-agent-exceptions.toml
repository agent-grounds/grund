[[exceptions]]
path = "crates/grund-core/src/scanner/file_pass.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 495, unit = "lines" }
until = "the per-line record leaves for a sibling, leaving the state machine alone in this file"
reason = """
The `scan_file_text` loop is a genuine single pass: eight pieces of mutable state (fence, Python docstring, current declaration, heading stack, counters) advance together per line, and that loop must not be broken apart. This is the argument the hard entry in docs/file-size-human-exceptions.toml carried at 1156 lines while the whole scanner category was one file; that entry retired when the scanner became a Rust module (§AR-system.2.5) took the file to 495, under the hard budget even after the explicit imports a module costs. Every boundary that entry named has now been taken: the note-reading helpers and the citation tokenizer left for grammar/inline_note_layout.rs and grammar/comment_line.rs, the comment-block classifiers and the block walk for grammar/comment_block.rs, the tree walk for scanner/walk.rs — §AR-scanner.1 is a directory traversal and §AR-scanner.2 is this line-by-line pass, and they meet only at the file list one hands the other — the qualified and escaped citation passes for scanner/citations.rs, the e2e case discovery of §AR-scanner.6 for scanner/e2e.rs, the qualified-suppression rule for grammar/never_rewrite.rs, and, with the module move, the two file tests of §AR-scanner.1 for scanner/walk_boundaries.rs, where a path and the `[scan]` table are the only inputs. What is left over the soft budget is §AR-scanner.2 and one thing that is not it: `CitationLine`, the per-line record the citation, value and shorthand passes all read, which four files and the grammar component share and only this one fills. Missing boundary: that record in a sibling, leaving the state machine as the whole file.
"""
