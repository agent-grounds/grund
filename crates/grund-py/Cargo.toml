[package]
name = "grund-py"
description = "Thin CPython frontend over the grund-core engine"
version.workspace = true
edition.workspace = true
# maturin refuses `..` in an include pattern, so this is how the sdist built from
# this directory carries the licence (§FS-distribution.3.3.7).
license-file = "../../LICENSE"
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
grund-core = { path = "../grund-core" }
pyo3 = { version = "0.27", features = ["abi3-py310"] }
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.27"

[features]
extension-module = ["pyo3/extension-module"]
