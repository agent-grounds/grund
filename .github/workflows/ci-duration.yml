# The meter of §AR-ci.requirements.3: averages each ci.yml gate over its last successful
# pushes to main and opens or edits one drift issue when a gate is over the threshold.
# It reads the forge, so it runs on a schedule and never as a gate on a push or pull request.

# The threshold and the window are read from .github/ci-duration.json (§AR-ci.requirements.4).
name: CI duration

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Average the gates and report drift
        run: python3 scripts/ci_duration.py
