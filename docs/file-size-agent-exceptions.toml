The hard twin is retired: the fixture builder moved to tests/support/init_fixture.rs and the entrypoint-selection cases to tests/init_agent_entrypoints.rs, which took this file from 1023 lines to 630 and under the hard budget. This entry now carries the argument alone. What is left is one area — what `init` writes and what it reports — whose cases are long because each builds a tree, runs the binary, and reads the bytes back, not because two areas share a file. Missing boundary: a second axis inside that area worth naming, most likely the scaffold contents against the report (`--docs`, `--force`, `--dry-run`, determinism).
"""
