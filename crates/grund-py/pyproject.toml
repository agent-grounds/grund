# The Python binding, one directory with its crate (§FS-distribution.3.3.7).
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "grund"
version = "0.20.0"
requires-python = ">=3.10"
description = "Embed the grund documentation grounding engine in Python"
readme = "README.md"
license = "MIT"
classifiers = ["Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
python-source = "python"
module-name = "grund._native"
features = ["extension-module"]
# maturin bundles the workspace manifest, the lockfile and the path dependencies
# itself; the licence reaches the sdist through `license-file` in Cargo.toml.
include = [
  { path = "python/**/*", format = "sdist" },
]
