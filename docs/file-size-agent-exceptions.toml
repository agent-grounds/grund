kind = "deferred"
max_accepted = { value = 1231, unit = "lines" }
until = "the rules specification is partitioned into grammar, refusal, relational-meaning, finding and command-surface declarations with existing section citations migrated"
reason = """
Missing boundary: the sentence grammar and its strict refusals (§FS-rules.3), the findings (§FS-rules.7) and the command surfaces with their refusal tables (§FS-rules.8) still share one declaration. Splitting them into separate declarations requires a mapped migration of their stable numbered section IDs and callers; §FS-rules.8.1 alone is cited from twelve files. That migration is outside the specification-only contract for issue #520, whose approved proposal names the new point §FS-rules.3.5.2 beside the refusals it extends. This entry records that existing debt while the point and its table are pinned. The fix for #511 then added §FS-rules.2.1, saying a chapter subject's `NAME` is its whole path, rewrote the §FS-rules.5.2 join that path changes, and added one sentence to §FS-rules.8. The relational meaning (§FS-rules.5) has grown its own sub-structure inside the same declaration too, and moving it out is the same mapped migration, not part of a selector bug fix. The fix for #507 then added §FS-rules.3.5.3, saying a chapter path is refused for the component that failed, beside the refusals it corrects, with one row in the §FS-rules.8.1 table; moving the refusals out is that same migration again, not part of a reason fix. The fix for #513 then added §FS-rules.3.5.4, the point every rule refusal's accepted form is built by, with its per-refusal table and the exact rows of a repository whose one kind is `FS`, beside the refusals it governs, where its approved proposal names it; the same mapped migration would move it out with them. The ceiling accepts exactly the measured 1231 non-blank lines and permits no growth.
"""
