          key: ${{ runner.os }}-cargo-${{ github.job }}-oracle-v1-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      # §AR-ci.3.4.5: a key of its own, so the Python target is saved, not lost to the
