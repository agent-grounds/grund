[package]
name = "grund"
version.workspace = true
edition.workspace = true
description = "The polyglot reference checker: validate and read ID-based citations across Markdown docs and source-code doc-comments."
keywords = ["documentation", "references", "linter", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
exclude = [
    "../../.agents/rhei/**",
    "../../target/**",
]

[dependencies]
grund-core = { path = "../grund-core", version = "0.17.1-dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# §FS-check.6.1: native notifications, never a polling fallback.
notify = "8.2"

# Bench-only — pulled in solely by the `bench` feature (see `[features]` below),
# so a plain `cargo build` / `cargo install grund` and the `cargo test` matrix
# never compile it. Optional dev-dependencies aren't allowed by Cargo, hence an
# optional regular dependency rather than a `[dev-dependencies]` entry.
iai-callgrind = { version = "0.16.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem"] }

[features]
# Gates the real `instructions` benchmark body and the only thing that pulls in
# `iai-callgrind`. Off by default so `cargo test --all-targets` / `cargo build
# --all-targets` compile a no-op bench target and never need Valgrind.
bench = ["dep:iai-callgrind"]
# Enables the core's test-only workspace-load observer for the batch contract.
test-workspace-load-count = ["grund-core/test-workspace-load-count"]
# Private watch observation and injection; absent from distributed builds (§AR-bindings.3).
test-watch = []

[[test]]
name = "check_watch_observer"
required-features = ["test-watch"]

[[bench]]
name = "instructions"
harness = false
