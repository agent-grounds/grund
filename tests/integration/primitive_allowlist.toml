primitives = ["citation_re"]
step = "#598"

[[allow]]
file = "writers/fmt_rewrite.rs"
primitives = ["citation_re", "declaration_id_on_line"]
step = "#598"

[[allow]]
file = "writers/fmt_tree.rs"
primitives = ["std::fs"]
step = "#598"

[[allow]]
file = "writers/init_workspace_members.rs"
primitives = ["split on /"]
step = "#599"
