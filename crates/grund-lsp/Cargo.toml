[package]
name = "grund-lsp"
version.workspace = true
edition.workspace = true
description = "Optional Language Server Protocol server for grund citations."
keywords = ["documentation", "references", "lsp", "language-server"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[dependencies]
anyhow = "1"
# One receiver for the client's messages and the native watcher's (§AR-lsp.2.1).
crossbeam-channel = "0.5"
grund-core = { path = "../grund-core", version = "0.20.1-dev", features = ["native-watch"] }
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1"
serde_json = "1"
url = "2"
