# The citation ledger: every family of facts §AR-system.principle holds to one
# defining point and one implementation, its defining points, the code that owns
# each, and the copies left to migrate (AR-system.principle.inventory). Points are
# written bare, without the marker, so this file cites nothing itself.
# test_citation_ledger.py holds it, both ways round:
#   - every point resolves;
#   - every code file citing a point is an owner or a migration row of its family;
#   - every owner and every migration row still cites a point of its family;
#   - a family marked done has no migration rows left.
# Each migration row names the step of agent-grounds/grund#576 that removes it, one
# listed live in one_answer_steps.toml, or the decision record that keeps it as
# `ruling`; test_one_answer_ledgers.py refuses a row naming neither. A file that
# only reads the owner's answer is no row: it cites the owner's AR point instead,
# as the kinds family's readers cite AR-config.1.5. The list only shrinks.

[[family]]
name = "run"
fact = "which files a run reads, what a path argument means, which projects it loads"
done = true
points = [
  "FS-scan.path",
  "FS-scan.projects.discovery",
  "FS-scan.projects.workspace-root",
  "FS-scan.projects.member",
  "FS-scan.projects.narrowed",
  "FS-scan.scope",
]
owners = [
  "crates/grund-core/src/config/global_excludes.rs",
  "crates/grund-core/src/config/run.rs",
  "crates/grund-core/src/config/v1/defaults.rs",
  "crates/grund-core/src/grammar/language_table.rs",
