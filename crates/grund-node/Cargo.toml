[package]
name = "grund-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node-API adapter over the shared grund engine"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
grund-core = { path = "../grund-core" }
napi = { version = "=3.14.1", default-features = false, features = ["napi8", "serde-json", "compat-mode"] }
napi-derive = { version = "=3.6.11", default-features = false, features = ["strict"] }
serde_json = "1"
rayon = "1"

[build-dependencies]
napi-build = "=2.6.0"

[features]
test-node-runtime = ["grund-core/test-binding-writes"]
