grund_config_version = 2
project_name = "external-tickets"

[schema.sources]
languages = ["markdown"]

[schema.sources.extensions]
txt = "markdown"

[schema.kinds.GR]
folders = ["docs/tickets"]
id_format = "{kind}-{number}"
index = false
fetch = "scripts/fetch-ticket"

[schema.kinds.GRUND]
files = ["docs/guide.md"]

[rules.resolution]
GR = "warn"
