# Manual minor releases implement §FS-distribution.4.4.
name: Release minor

# §FS-distribution.4.4.2: default to the next minor from the latest stable tag,
# or let the owner explicitly select 1.0.0 with expected_main_sha identifying
# the dispatch main tip (not #467's freeze candidate).

# Both choices build the release and next -dev version on candidate branches, push both to
# main once CI and a release dry run pass on them, and dispatch release.yml to
# publish crates + binaries. release.yml remains the publishing workflow; this
# file only prepares the version bump.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare through the shared release checks'
        type: choice
        required: true
        default: next-minor
        options:
          - next-minor
          - '1.0.0'
      expected_main_sha:
        description: 'Full dispatch main tip SHA, not the freeze candidate; required for 1.0.0'
        type: string
        required: false

permissions:
  contents: write
  actions: write   # gh workflow run needs actions:write to dispatch
  pull-requests: read   # `prepare_changelog_release.py prepare` asks which PR each commit landed in

env:
  CARGO_TERM_COLOR: always

jobs:
  minor-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use the same release PAT as auto-bump.yml so the version commit can
          # pass the main-branch ruleset bypass configured for releases.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Resolve current and next versions
        id: versions
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.version }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          args=(--ref "$DISPATCH_REF" --dispatch-sha "$DISPATCH_SHA"
                --version "$SELECTED_VERSION")
          if [ -n "$EXPECTED_MAIN_SHA" ]; then
            args+=(--expected-main-sha "$EXPECTED_MAIN_SHA")
          fi
          outputs="$(python3 scripts/release_version.py "${args[@]}")"
          printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"

      - name: Gate - CI on current main tip is green
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # The CI workflow runs on push to main. Find the most recent run that
          # targeted this exact tip; if none exists yet, the bump must wait.
          run="$(gh run list --workflow=CI --branch=main --limit=20 \
            --json status,conclusion,headSha,databaseId \
            | jq -c ".[] | select(.headSha == \"$sha\")" | head -n1)"

          if [ -z "$run" ]; then
            echo "error: no CI run found for HEAD ($sha); rerun once CI has finished" >&2
            exit 1
          fi
          status="$(echo "$run" | jq -r '.status')"
          conclusion="$(echo "$run" | jq -r '.conclusion')"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "error: CI on $sha is $status/$conclusion (need completed/success)" >&2
            exit 1
          fi
          echo "CI on $sha is green."

      # §FS-distribution.4.2.6: refuse a selected release the tree's own messages
      # contradict - a ramp still promising this release, or one already landed
      # for a later one. Fails before a candidate branch is pushed.
      - name: Gate - the tree can be released as this version
        shell: bash
        run: python3 scripts/check_release_ramps.py "${{ steps.versions.outputs.next }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bump workspace version and refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          # §FS-distribution.4.5: write package versions and both checked CLI version inputs.
          python3 scripts/distribution/candidate.py set-version "${{ steps.versions.outputs.next }}"
          cargo update --workspace
          # The release section lists the pull requests merged since the tag, read
          # from the forge with GH_TOKEN (§FS-distribution.4.6.1); nothing is written first.
          python3 scripts/prepare_changelog_release.py prepare "${{ steps.versions.outputs.next }}"

      - name: Commit and push release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          branch="release-candidate/v${next}-${GITHUB_RUN_ID}"
          base_sha="$(git rev-parse HEAD)"

          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # §FS-distribution.4.5: the release index includes the authored version input too.
          git add Cargo.toml crates/grund-core/Cargo.toml crates/grund-cli/Cargo.toml crates/grund-lsp/Cargo.toml Cargo.lock crates/grund-py/pyproject.toml tests/e2e/cases/cli-version/expected.stdout tests/integration/command_agreement_facts/cli-version.json docs/changelog.md docs/changelog
          git commit -m "Release v${next}"
          git push -u origin "$branch"

          sha="$(git rev-parse HEAD)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # §FS-distribution.4.4.1: the -dev advance is built here, over the release
      # commit, so CI runs on the commit main will hold rather than on one made
      # after the release. §FS-distribution.4.1: it is pushed only after a release.
      - name: Commit and push the dev candidate
        id: dev_candidate
        shell: bash
        run: |
          set -euo pipefail
          released="${{ steps.versions.outputs.next }}"
          IFS=. read -r major minor patch <<< "$released"
          dev="${major}.${minor}.$((patch + 1))-dev"
          branch="${{ steps.candidate.outputs.branch }}-dev"
          # Without this main keeps the version it just released until the next
          # bump, so a binary built from main is indistinguishable from the tag it
          # is ahead of. The suffix is what makes `--version` say which side of
          # the tag a build came from.
          git switch -c "$branch"
          # §FS-distribution.4.5: write and stage both version inputs in this dev candidate.
          python3 scripts/distribution/candidate.py set-version "$dev"
          git add -A
          git commit -m "Open ${dev} for development"
          git push -u origin "$branch"

          echo "dev=$dev" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # §FS-distribution.4.4.1: main moves only to commits these runs passed - the
      # dry run on the release commit, and CI on it and on the -dev advance.
      - name: Dry-run the release and run CI on both candidates
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          branch="${{ steps.candidate.outputs.branch }}"
          sha="${{ steps.candidate.outputs.sha }}"
          dev_branch="${{ steps.dev_candidate.outputs.branch }}"
          dev_sha="${{ steps.dev_candidate.outputs.sha }}"

          dry_run="$(python3 scripts/candidate_runs.py dispatch release.yml "$branch" "$sha" \
            version="$next" publish_crates=false create_github_release=false)"
          release_ci="$(python3 scripts/candidate_runs.py dispatch ci.yml "$branch" "$sha")"
          dev_ci="$(python3 scripts/candidate_runs.py dispatch ci.yml "$dev_branch" "$dev_sha")"
          python3 scripts/candidate_runs.py watch "$dry_run" "$release_ci" "$dev_ci"

      - name: Publish release commit and dispatch release
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.versions.outputs.next }}"
          branch="${{ steps.candidate.outputs.branch }}"
          base_sha="${{ steps.candidate.outputs.base_sha }}"
          sha="${{ steps.candidate.outputs.sha }}"

          git fetch origin main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current_main" != "$base_sha" ]; then
            echo "error: main moved from $base_sha to $current_main while the candidate runs were running" >&2
            echo "       leaving $branch in place; rerun the minor release from the new main tip" >&2
            exit 1
          fi

          git push origin "${sha}:refs/heads/main"

          # GITHUB_TOKEN pushes do not fan out to other workflows, so dispatch
          # release.yml directly from main after the verified version bump lands.
          gh workflow run release.yml \
            --ref main \
            -f version="$next" \
            -f publish_crates=true \
            -f create_github_release=true
          git push origin --delete "$branch" || true

      - name: Advance main to the next dev version
        shell: bash
        run: |
          set -euo pipefail
          released="${{ steps.versions.outputs.next }}"
          dev="${{ steps.dev_candidate.outputs.dev }}"
          branch="${{ steps.dev_candidate.outputs.branch }}"
          sha="${{ steps.dev_candidate.outputs.sha }}"
          # §FS-distribution.4.4.1: the commit CI passed, retried onto an unmoved main.
          bash scripts/advance_dev.sh "$released" "$dev" "$branch" "$sha"
