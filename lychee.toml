# Bounded external-link tolerance: §AR-ci.3.1.1.
timeout = 30
max_retries = 4
retry_wait_time = 1

exclude = [
  # The RFC example's draft asks IANA to register this problem type; the entry
  # exists only once the registration it requests is made.
  "^https://iana\\.org/assignments/http-problem-types#stale-widget$",
  # Inline-spec stubs are resolved by grund from the repo root; Markdown link
  # checkers resolve them relative to the stub file.
  "docs/architecture/src/checker\\.rs$",
  # The optional-member example is a checkout without packages/secret, whose
  # managed blocks keep listing it (§FS-init.2.3.4.15.8): the link is the lesson.
  "examples/workspace-optional-member/.*/packages/secret/?$",
  # The fmt-reporting example is the tree just after a rename, whose stale link
  # is what its `fmt` run re-derives (§FS-fmt.3.7): the link is the lesson.
  "examples/fmt-reporting/repo/docs/functional-spec/FS-login\\.md",
  # The downstream-citers run is the tree just after a listed point's file is
  # deleted, whose page `check` then refuses (§FS-examples.2): the link is the lesson.
  "examples/downstream-citers/3-deleted/repo/docs/functional-spec/security-providers\\.md",
  # The OpenSpec example's archived change moved unchanged, as `openspec archive`
  # moves it, and a living spec still links the renamed requirement: the links
  # left dangling are the lesson of its fourth run.
  "examples/openspec/4-archived/repo/openspec/changes/specs/loans/spec\\.md#",
  "examples/openspec/4-archived/repo/openspec/specs/loans/spec\\.md#borrow-a-book-requirement-borrow-a-book$",
  # GitHub draws line anchors with script, so no checker finds them; these point
  # into a pinned tag, so the line they name cannot move.
  "^https://github\\.com/Fission-AI/OpenSpec/blob/v1\\.14\\.3/[^#]+#L[0-9]+$",
]
