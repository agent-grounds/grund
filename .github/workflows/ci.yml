      - name: python tests
        # §FS-cochange-recipe.examples: compatibility is mandatory, not environment-dependent.
        run: python scripts/run_python_gate.py --without-node-acceptance

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
            ~/ag/tmp/grund-cochange-release-0.16.1
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}

