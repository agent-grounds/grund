grund_config_version = 2
project_name = "madr"

[schema.kinds.ADR]
folders = ["docs/adr"]
index = false

[schema.kinds.ADR.fields.front-matter]
presence = "must"
closed = "must"

[schema.kinds.ADR.fields.front-matter.keys.status]
presence = "must"
one_of = ["proposed", "accepted"]

[schema.kinds.ADR.fields.front-matter.keys.author]

[schema.kinds.ADR.fields.front-matter.keys.title]

[schema.kinds.ADR.fields.front-matter.keys.date]

[schema.kinds.ADR.fields.front-matter.keys.summary]

[schema.kinds.page]
citable = false
files = ["README.md"]
