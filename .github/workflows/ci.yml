    steps:
      - name: every job it needs succeeded
        if: ${{ needs.rust-ubuntu.result != 'success' || needs.python-ubuntu.result != 'success' || needs.node-ubuntu.result != 'success' || needs.pre-commit.result != 'success' || !(needs.bench.result == 'success' || needs.bench.result == 'skipped' && github.event_name == 'merge_group') }}
        run: exit 1

  test-windows:
    name: cargo test (windows-latest)
    runs-on: ubuntu-latest
    needs: [rust-windows, python-windows, node-windows]
    if: always()
    steps:
      - name: every job it needs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

  # `pre-commit run --all-files` cannot reproduce the `commit-msg` stage — it takes a
  # message file, not a file list — so a trailer that lives only in a commit message
  # rides in unchecked. This job scans what the event adds (§AR-ci.8.2).
  commit-messages:
    name: commit message attribution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The range endpoints must both be present; a shallow clone has neither.
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: scan commit messages
        shell: bash
        env:
          # A pull request scans base..head, so a rewritten or rebased branch is
          # judged on the commits it actually contributes. A push scans what it
          # added; the script narrows to the tip commit when `before` names a
          # commit the runner cannot resolve (first push, force-push).

          # §AR-ci.12: a merge-queue group scans base_sha..head_sha, what it puts on main.
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || github.event_name == 'merge_group'
                && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: python scripts/check_no_claude_attribution.py --range "$RANGE"

  # Instruction-counting benchmarks for the hot CLI commands (§AR-benchmarks /
  # §AR-ci.5): kept out of the suite jobs because only this job needs Valgrind, and
  # pull requests gate on a base-branch baseline (§AR-benchmarks).
  bench:
    name: cargo bench (instruction counts)
    # §AR-ci.12: a queue group neither compares nor records; its push to main records.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Install Valgrind and iai-callgrind-runner
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          # The runner version must match the `iai-callgrind` dev-dependency in Cargo.toml.
          cargo install iai-callgrind-runner --version 0.16.1 --locked --quiet
          rm -rf target/iai  # §AR-ci.5.2: cached counts are another commit's, not a baseline

      - name: Save base branch benchmark baseline
        if: github.event_name == 'pull_request'
        run: |
          git checkout --force "origin/${{ github.base_ref }}"
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-baseline=main --save-summary=json
          git checkout --force "${{ github.sha }}"

      - name: cargo bench
        if: github.event_name != 'pull_request'
        run: cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json

      - name: cargo bench regression gate
        if: github.event_name == 'pull_request'
        run: cargo bench -p grund --features bench --locked --quiet --bench instructions -- --baseline=main --save-summary=json

      - name: Upload benchmark summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iai-callgrind-summaries
          path: target/iai/**/summary.json
          if-no-files-found: ignore

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
