The landing page still includes detailed command walkthroughs beside its concise introduction. Missing boundary: guide pages carrying those longer scenarios, with the landing page linking them while preserving its real-excerpt obligations under §REQ-readme.2. Issue 474 updates the roadmap link and aligns the both-evidence wording within one existing line; the runnable recipe guidance is a later implementation task. No README lines or size growth are added in this specification commit. The ceiling accepts exactly its current non-blank line count and permits no growth.
