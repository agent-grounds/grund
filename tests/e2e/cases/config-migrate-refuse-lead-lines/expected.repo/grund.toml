grund_config_version = 1
project_name = "example"

[reference]
lead_size_warning = { max = 40, unit = "lines" }

[id]
format = "{kind}-{slug}"
named_sections = true
slug_pattern = "[a-z][a-z0-9-]*"

[[kinds]]
kind = "FS"
file = "requirements.md"

[scan]
include = ["requirements.md"]
extensions = ["md"]
