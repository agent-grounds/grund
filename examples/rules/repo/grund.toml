grund_config_version = 1

[reference]
strict = true

[id]
format = "{kind}-{slug}"
named_sections = true

[[kinds]]
kind = "GOAL"
folder = "docs/goals"
index = false

[[kinds]]
kind = "REQ"
folder = "docs/req"
index = false

[[kinds]]
kind = "FS"
folder = "docs/fs"
index = false

[[kinds]]
kind = "AR"
folder = "docs/ar"
index = false

[[kinds]]
kind = "RULE"
folder = "docs/rules"
index = false
rules = true

[[kinds]]
kind = "e2e"
folder = "tests/e2e"
citable = false

[citations.RULE]
must = ["GOAL"]

[citations.FS]
must = ["GOAL"]

[citations.e2e]
must = ["FS"]

[scan]
include = ["docs", "tests"]
