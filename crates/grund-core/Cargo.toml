[package]
name = "grund-core"
version = "0.20.1-dev"
edition.workspace = true
description = "Core engine for grund: scanner, checker, show, fmt, config, and shared data APIs."
keywords = ["documentation", "references", "linter", "agents"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "assets/**", "examples/**", "Cargo.toml", "README.md"]

[dependencies]
ignore = "0.4"
# Git's config grammar and single-pass home interpolation (§FS-scan.scope.ignore-files.pathname).
gix-config = { version = "0.62", features = ["sha1"] }
regex = "1"
# Only for §FS-config.3.2: "can this ID pattern match a `/`?" is a question about
# the pattern's parsed syntax, not its text. `regex` already builds on this crate
# at the same version, so asking it directly adds nothing to the dependency tree.
regex-syntax = "0.8"
anyhow = "1"
once_cell = "1"
rayon = "1"
unicode-normalization = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# grund's one SHA-256 (§FS-section-lock.holds.fingerprint), the digest
# §FS-remote-projects.bytes.digest names.
sha2 = "0.10"
# The YAML event parser behind a value source's YAML reader and the span tree
# front matter will share (§DA-yaml-value-reader.2.1). MIT OR Apache-2.0, pure
# Rust; without its `encoding` feature it adds `arraydeque` (MIT OR Apache-2.0),
# `hashlink` (MIT OR Apache-2.0) and `foldhash` (Zlib).
yaml-rust2 = { version = "0.13", default-features = false }
# The TOML event parser behind the span tree a `+++` front-matter block is read
# through (§DA-toml-front-matter-reader.2.1). MIT OR Apache-2.0, pure Rust; it
# adds `winnow` (MIT). Pinned `~1.1` because the series is the TOML version it
# reads, 1.1. Only `alloc` is on, for its event and error lists and decoded
# strings; `std` adds nothing the tree uses.
toml_parser = { version = "~1.1", default-features = false, features = ["alloc"] }
# §FS-check.6.1: native notifications, never a polling fallback. Only through the
# `native-watch` feature below.
notify = { version = "8.2", optional = true }

[[example]]
name = "grund-binding-oracle"
path = "examples/grund-binding-oracle.rs"

[features]
# The native watcher `check --watch` runs and an editor server falls back on
# (§AR-lsp.2.1): only grund-cli and grund-lsp enable it, so the bindings never link it.
native-watch = ["dep:notify"]
test-binding-writes = []
# Black-box CLI tests use this opt-in observer to prove a batch loads one
# workspace context. It is absent from normal builds.
test-workspace-load-count = []
