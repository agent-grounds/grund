            ${{ runner.os }}-cargo-

      # §AR-ci.13.7: one shard of the cargo suite; rust-ubuntu runs the leg's other
      # Rust checks.
      - name: cargo test
        run: python scripts/run_cargo_suite.py --shard 2/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
