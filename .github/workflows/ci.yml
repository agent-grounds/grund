        run: python scripts/check_no_claude_attribution.py --range "$RANGE"

  # Instruction-counting benchmarks for the hot CLI commands (§AR-benchmarks / §AR-ci.5),
  # out of the suite jobs because only these need Valgrind: a build job, a shard per leg
  # (§AR-benchmarks.1.2.2), and a record job that merges them (§AR-benchmarks.7.1.1).
  bench-build:
    name: cargo bench (build)
    # §AR-ci.12: a queue group builds its head alone, as a push does, for its shards to hold
    # to the ceilings; the push the queue makes to main records.
    runs-on: ubuntu-latest
    # §AR-ci.5: the count's every input is pinned here and in the shards, and only there. The
    # digest is release.yml's RUST_TOOLCHAIN and its C library; BENCH_IMAGE and every cache
    # key of both jobs repeat it, so change them all together.
    container:
      image: rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    env:
      BENCH_IMAGE: sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      LC_ALL: C.UTF-8
      TZ: UTC
      RAYON_NUM_THREADS: 4
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bench-cache
        id: cargo

      # §AR-ci.5.1: only the base *binary* comes from the base branch; its harness and
      # fixture generator never run, so a change to either cannot read as a code change.
      - name: Build the base branch's binary
        if: github.event_name == 'pull_request'
        run: |
          # The container runs as root over a workspace the runner owns.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --force "${{ github.event.pull_request.base.sha }}"
          cargo build --profile bench -p grund --features bench --bin grund --locked --quiet
          install -D target/release/grund bench-bin/base/grund
          git checkout --force "${{ github.sha }}"

      # §AR-ci.5: the head's `grund`, its harness and its `grund-lsp` (§AR-benchmarks.1.7),
      # all with the bench profile.
      - name: Build the head's binaries and the harness
        run: |
          cargo bench -p grund --features bench --locked --quiet --bench instructions --no-run
          cargo build --profile bench -p grund-lsp --locked --quiet
          # A shard's `cargo bench` finds this target fresh and builds nothing; tar keeps the
          # executable bits an artifact drops.
          mkdir -p bench-bin
          tar -cf bench-bin/target.tar --exclude=target/release/incremental target/release
          sha256sum target/release/grund | cut -d' ' -f1 > bench-bin/head-grund.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bench-binaries
          path: bench-bin
          retention-days: 1

      # §AR-ci.13.6: only a push to main saves, after the work.
      - uses: ./.github/actions/bench-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        with:
          save: true

  bench:
    name: cargo bench (shard ${{ matrix.shard }})
    needs: [bench-build]
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one regression does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    # §AR-ci.5: the build job's image and env, so its binaries are measured where they
    # were built.
    container:
      image: rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      # §AR-ci.5: iai-callgrind runs Valgrind under `setarch -R`, with ASLR off, and the
      # default seccomp profile refuses that personality call.
      options: --security-opt seccomp=unconfined
    # bash -eo pipefail, so a check piped into the job summary still fails the step.
    defaults:
      run:
        shell: bash
    env:
      BENCH_IMAGE: sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      LC_ALL: C.UTF-8
      TZ: UTC
      RAYON_NUM_THREADS: 4
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ""
      # §AR-ci.5.2: every run here is CI's series, held to the catalog's absolute ceilings.
      GRUND_BENCH_CEILINGS: 1
      # §AR-benchmarks.1.2.2: this leg's rows; `7` is the catalog's `shards`.
      GRUND_BENCH_SHARD: ${{ matrix.shard }}/7
    steps:
      - uses: actions/checkout@v6

      # §AR-ci.13.6: one shard saves the registry, on a push to main only.
      - uses: ./.github/actions/bench-shard
        with:
          artifact: bench-binaries
          save-registry: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      # §AR-benchmarks.5.1: a scenario the base binary refuses is left out and listed.
      - name: Save the base binary's baseline under this harness
        if: github.event_name == 'pull_request'
        run: |
          export GRUND_BENCH_BIN="$PWD/bench-bin/base/grund" GRUND_BENCH_REFUSED="$RECORDS/refused.txt"
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-baseline=main --save-summary=json
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/base-${{ matrix.shard }}.json" --binary "$GRUND_BENCH_BIN" --commit "${{ github.event.pull_request.base.sha }}" --refused "$GRUND_BENCH_REFUSED"

      # §AR-benchmarks.7.2: this shard's comparison is printed even when a limit fails the
      # gate, which skips the record job's merged one; the step still fails after it.
      - name: cargo bench regression gate
        if: github.event_name == 'pull_request'
        run: |
          set +e
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --baseline=main --save-summary=json
          gate=$? && set -e
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/head-${{ matrix.shard }}.json"
          python3 scripts/bench_record.py compare "$RECORDS/base-${{ matrix.shard }}.json" "$RECORDS/head-${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$gate"

      # §AR-benchmarks.7.3: a push to main runs the same binary again and holds the bound.
      # A failure on an unchanged binary is a flaky test: file it (`bug`, `flaky-test`).
      - name: cargo bench
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/first-${{ matrix.shard }}.json"
          [ "${{ github.event_name }} ${{ github.ref }}" = "push refs/heads/main" ] || exit 0
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/second-${{ matrix.shard }}.json"
          python3 scripts/bench_record.py jitter "$RECORDS/first-${{ matrix.shard }}.json" "$RECORDS/second-${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # §AR-ci.5.1, §AR-ci.12: a merge-queue group runs its head once, held to the ceilings
      # alone; it measures no base, compares nothing and records nothing.
      - if: github.event_name == 'merge_group'
        run: cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json

      # §AR-ci.5: the harness measured the build job's binary; a shard that rebuilt it fails.
      - uses: ./.github/actions/bench-built

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-records-${{ matrix.shard }}
          path: |
            target/iai/**/summary.json
            bench-records/*.json

  bench-record:
    name: cargo bench (record)
    needs: [bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: bench-records-*
          path: shards

      # §AR-benchmarks.7.1.1: one record per revision, merged from every shard's partial; a
      # merge that refuses fails the job. A queue group merges and uploads none (§AR-ci.12).
      - name: Merge the shards' records and compare
        if: github.event_name != 'merge_group'
        shell: bash
        run: |
          merge() { mkdir -p records && python3 scripts/bench_record.py merge --out "records/$1.json" shards/*/bench-records/"$1"-*.json; }
          if [ "${{ github.event_name }}" != pull_request ]; then merge first; exit; fi
          merge base && merge head
          python3 scripts/bench_record.py compare records/base.json records/head.json | tee -a "$GITHUB_STEP_SUMMARY"

      - if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: iai-callgrind-summaries
          path: records/*.json
