[workspace]
members = ["crates/grund-core", "crates/grund-cli", "crates/grund-lsp", "crates/grund-py", "crates/grund-node", "tests/integration", "examples/rust-api"]
default-members = ["crates/grund-cli"]
resolver = "3"

[workspace.package]
version = "0.21.1-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/agent-grounds/grund"
homepage = "https://github.com/agent-grounds/grund"

[profile.release]
lto = true
codegen-units = 1
# Distributed release binaries are additionally profile-guided-optimized via
# `scripts/pgo-build.sh` (training run = the benchmark workload — §AR-benchmarks,
# §DA-pgo-release). PGO is a multi-phase generate/run/rebuild pipeline that needs
# a profile absent on a fresh clone, so it cannot live here or in the dev loop;
# a plain `cargo build --release` (and `cargo install grund`) is LTO-only and
# behaviour-identical.

# The tests spend most of their time inside dependencies, so dev and test builds
# compile those at level 1 and the workspace crates at 0 (§AR-ci.15).
[profile.dev.package."*"]
opt-level = 1
