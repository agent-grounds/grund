grund_config_version = 1

[reference]
strict = true
require_grounding = false

[id]
format = "{kind}-{slug}"

[[kinds]]
kind = "GOAL"
folder = "docs/goals"
index = false

[[kinds]]
kind = "FS"
folder = "docs/fs"
index = false

[[kinds]]
kind = "RULE"
folder = "docs/rules"
index = false
rules = true

[scan]
include = ["docs"]
