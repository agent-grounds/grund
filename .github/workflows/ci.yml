name: CI

on:
  push:
    branches: [main]
  pull_request:
  # §AR-ci.12: the merge queue runs this on each group before main moves to it.
  merge_group:
  # §FS-distribution.4.4.1: the release helpers run this on their candidate
  # commits before main moves to them.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # §AR-ci.13.6: no incremental state is written, so none reaches a cargo cache.
  CARGO_INCREMENTAL: 0
  # Treat rustc warnings as errors for the binary itself. NOTE: this does not
  # deny clippy lints — clippy is intentionally not part of CI here. Add a
  # `cargo clippy --no-deps -- -D warnings` step if/when we want lint enforcement.
  RUSTFLAGS: "-D warnings"
  # §FS-distribution.3.0.3: corpus pipes carry UTF-8 on every host.
  PYTHONUTF8: "1"

# §AR-ci.13: each operating system's suites run as jobs of their own, side by side,
# written out rather than generated so the tests can read them as text. Each OS's
# required check, `cargo test (<os>)`, is the aggregate at the end that judges them.

# macOS is not here: its suites run once a day in macos.yml (§AR-ci.14).

# §AR-ci.13.6: each job restores its caches first and saves them last, on a push to main
# alone. A cache failure only warns: actions/cache/restore and /save report one as a
# warning and go on, so a job never stops on its cache (§AR-ci).
jobs:
  # §AR-ci.13.1: the ubuntu-latest leg, one job per language.
  rust-ubuntu:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # §AR-ci.13.4: the key names its job, so no job's save is lost to another's exact hit.
      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # §FS-check.6.1.1, §AR-bindings.3: exercise actual native backends and
      # private lifecycle boundaries on Linux, macOS and Windows.
      - name: native watch contract
        run: python scripts/run_cargo_suite.py -p grund --features test-watch --test check_watch_observer --locked

      - name: cargo build
        run: cargo build --quiet --workspace --all-targets --locked

      - name: grund self-check
        shell: bash
        run: |
          # `--full` (§FS-check.1.3) walks past `[scan] include` as well, so a citation this
          # repository's own config forgot to cover — examples/ is deliberately outside it —
          # fails CI instead of accumulating unseen.

          # The 30s ceiling is the catastrophic-regression guard (§AR-ci.4 /
          # §GOAL-fast-feedback); the `bench` job (§AR-benchmarks / §AR-ci.5) is the precise
          # meter. Python, not GNU `timeout`, so the same step runs on all three platforms.
          python - <<'PY'
          import subprocess
          import sys

          try:
              result = subprocess.run(
                  ["cargo", "run", "--quiet", "--locked", "--", "check", ".", "--format", "json", "--full"],
                  stdout=subprocess.PIPE,
                  timeout=30,
              )
          except subprocess.TimeoutExpired:
              print("grund self-check exceeded 30s", file=sys.stderr)
              sys.exit(124)

          if result.returncode != 0:
              sys.exit(result.returncode)
          if result.stdout:
              print("grund self-check wrote unexpected stdout:", file=sys.stderr)
              sys.stderr.buffer.write(result.stdout)
              sys.exit(1)
          PY

      # crates/grund-cli/tests/e2e.rs walks every fixture under tests/e2e/cases and asserts each case's
      # exit code, stdout, and stderr against its expected.* files; tests/init.rs
      # covers the file-content / config-validation contract for `grund init`. So
      # `cargo test` runs the full e2e suite plus the core and CLI unit tests.

      # §AR-ci.requirements.5.2: failures, a check-in each 5% and one summary, no line per test.
      - name: cargo test
        run: python scripts/run_cargo_suite.py --workspace --all-targets --locked --features grund/test-workspace-load-count

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}

  python-ubuntu:
    name: python (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # §FS-distribution.3.2.3.2: acceptance uses a supported Node major.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      # §FS-distribution.3.2.3.3: source builders require this pinned toolchain.
      - name: Install binding Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      # §AR-ci.13.4: the key names its job, so no job's save is lost to another's exact hit.
      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
            ~/ag/tmp/grund-cochange-release-0.16.1
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

