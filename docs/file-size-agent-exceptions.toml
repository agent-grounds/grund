[[exceptions]]
path = "crates/grund-cli/src/cli_help.rs"
match = "exact"
rules = ["core-source"]
kind = "structural"
max_accepted = { value = 492, unit = "lines" }
until = "indefinite"
reason = """
The help screens are one user-facing document rendered per command, and their worth is consistency: the same section order, voice, and example style across the 12 command arms and the top-level page. That consistency is held by seeing them together. Scattering them beside their commands makes drift between screens the likeliest failure and produces no compile-time signal when it happens. The file is text, not logic: no state, no branching beyond the command match, nothing to test. Its length tracks the command surface, not accumulated logic: the ceiling moved 486 -> 488 because the one-per-agent rule (§FS-init.2.1.1) made the --claude line too long for a single println!, and 488 -> 492 when `grund init` gained `--check` (§FS-init.1) and the init screen owed it a usage token, an option line, an example, and the `1` in its `Exit:` line — which is one flag being described accurately rather than logic accruing.
"""
[[exceptions]]
path = "scripts/try-integrations.sh"
match = "exact"
rules = ["scripts"]
kind = "structural"
until = "indefinite"
max_accepted = { value = 461, unit = "lines" }
reason = """
A manual smoke script a human reads top to bottom while testing terminals by hand; its linearity is the feature, and functions would hide the sequence being followed. It is also run unattended now — `tests/integration/integrations_resolve.rs` drives its headless `resolve` mode as a gate — and that does not change the shape: the script stays one linear file by decision, so the entry is structural rather than deferred. The ceiling follows the file when a fix grows it, as the two `set -e` fixes of 2026-08-26 did.
"""
[[exceptions]]
path = "crates/grund-core/src/fmt_links.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
until = "a third emission profile lands and the planner gains real branching"
max_accepted = { value = 427, unit = "lines" }
reason = """
Link planning (which citations need a link, and to which anchor) and link writing (splice text without disturbing surrounding bytes) are two phases communicating through a plan type, so the seam exists and is clean. It is simply not worth taking at 77 lines over: two files whose combined interface is larger than today's. Revisit when a third emission profile lands (§FS-fmt.6) and the planner gains real branching. The ceiling moved 423 -> 427 when the wrapper learned to honour the always-linkify carve-out's ID filter (§FS-fmt.6.1) — four lines inside the planning phase, which is the phase that would move out.
"""
[[exceptions]]
path = "skills/grund-init/SKILL.md"
match = "exact"
rules = ["entrypoints"]
kind = "structural"
max_accepted = { value = 394, unit = "lines" }
until = "indefinite"
reason = """
This file cannot be split. It is a shipped artifact, not source: init_templates.rs embeds it verbatim via include_str! as AGENT_SETUP_INSTRUCTIONS, `grund agent-setup-instructions` prints exactly those bytes, and a test asserts it is byte-identical to the mirror under crates/grund-core/assets/ (§FS-init.5). Any split either changes the emitted document or makes the command reassemble it at runtime, which moves document structure into code. Its length is the length of the instructions grund promises to emit; the only honest way to shrink it is to promise less. The ceiling therefore moves with what grund promises to say: 387 -> 394 when `[[kinds]]` gained non-citable kinds (§FS-config.3.4.1) and the setup interview had to learn to ask about the directories that are places rather than ID namespaces.
"""
[[exceptions]]
path = "crates/grund-core/src/list.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
until = "the renderers stop changing with the query"
max_accepted = { value = 409, unit = "lines" }
reason = """
The declaration catalog query and its renderers, 57 lines over budget (18 before `--unused` learned to discount a kind's own index entries, §DF-index-not-an-inbound-citation, 30 before that discount stopped being written twice, and 47 before the `--summary` fix below). They change together — every field the query learns to select is a field the output shapes have to show — so splitting now produces two files that are always opened as a pair. What retires this is that coupling ending, not the file growing.

The last +10 is `--summary` learning to sort its rows by alias and size the alias column to the widest one emitted, mirroring the same fix in `api.rs` so the deprecated path cannot re-diverge from the live one on the same bug (§FS-workspace.8.3, issue #68).

The last +2 is the `--kind` selector learning to tell a typo from a configured kind that declares no IDs (§FS-config.3.4.1) — one more arm on the check that was already there, in the query half rather than the renderers.

The +17 before it is a deduplication, not accretion: `ListCitationCounts` is the one pass that builds both counts, and `api.rs` had carried a byte-identical copy of it. Moving the copy here took `api.rs` from 1854 to 1822 raw lines while this file gained 30, so the pair is 2 lines smaller than before and the two commands can no longer disagree about what `--unused` selects.
"""
[[exceptions]]
path = "crates/grund-core/src/grammar/shorthand.rs"
match = "exact"
rules = ["core-source"]
kind = "structural"
max_accepted = { value = 496, unit = "lines" }
until = "indefinite"
reason = """
One rule that has to hold identically at four stages: the shape recognized in a file (scanner), accepted as a CLI argument (show/refs), reported (checker), and rewritten (fmt). A divergence between any two of them is precisely the defect DF-number-only-citation-shorthand exists to fix, so the file's cohesion is the invariant, not a stage. The available split is by stage — which is what the categories in AR-core-module-layout.1 already cut by — and it would put the four halves of one contract back in four files with nothing naming the contract, recreating the drift the feature module prevents. What was separable has been separated, and the boundary that separates it is "shape, not rule": the `[id] format` template parser, the ID renderer, and the post-match tests for where a token of that grammar ends — `id_token_ends_cleanly` and the numeric-run test of FS-fmt.2.4.1, both pure functions of the compiled grammar and a string — are grammar rather than shorthand and live in id_format.rs; the live on-type transform is in on_type.rs. What is left is the rule and nothing else, and no sub-part of it is reachable without the derivation above it. The ceiling moved 485 -> 495 when `grammar` became a Rust module (§AR-system.2.1) and the file paid for its own imports; it tracks that cost, not accumulated logic. It moved 495 -> 496 for the same reason when the scanner became one (§AR-system.2.5): the two shorthand questions asked of a declaration catalog came down into grammar/shorthand_targets.rs, and naming them where they now live costs this file one import line.
"""
[[exceptions]]
path = "crates/grund-core/src/tests_shorthand.rs"
match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 475, unit = "lines" }
until = "a third shorthand behaviour area earns its own module, the way the rewrite cases already did"
reason = """
The rewrite cases already left, to tests_shorthand_rewrite.rs — that was the seam, and it is spent. What remains is one area: what `check` reports about a shorthand, plus the two surfaces that must agree with it (the CLI argument resolver and the LSP snapshot). These fail together — a change to the recognition boundary or the candidate rule breaks the report, the query, and the editor in one move — so a reader chasing one is chasing all three. A second cut here would be by fixture shape rather than by behaviour, which is the split the tests rule exists to prevent.
"""

[[exceptions]]
path = "crates/grund-core/src/grammar/compiled.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 388, unit = "lines" }
until = "the heading-text reduction and the managed-block markers leave, so this file is the compiled grammar and nothing else"
reason = """
The compiled ID grammar: `Grammar::build` turning `[id] format`, the kinds and the comment prefixes into one set of regexes. It is the module's grammar file since `grammar` became a Rust module (§AR-system.2.1): the per-line readers — the comment-prefix alternation and the Python-docstring normalization of §AR-scanner.4 — left with the move, into `grammar/source_line.rs`, which was the boundary the previous entry named, and the three `[scan]` defaults left for config.rs because they are config defaults rather than grammar. That took the ceiling 411 -> 387 even after the explicit imports a module costs. What is left over the budget is two groups that are not the grammar either: the heading-text reduction a renderer's anchor is slugged from (§DF-github-anchor-fidelity) and the managed-block delimiters of §FS-init.2.3, both regexes over text that `Grammar::build` never reads. Missing boundary: each of those as its own file. Not taken with the module move, because a component's first commit moves files rather than inventing them. The ceiling moved 387 -> 388 when the scanner became a module (§AR-system.2.5) and two of this component's own items came down out of scanner files — `LegacyGrammar` to grammar/near_miss.rs and the `{kind}` literal reader of the `[id] format` template to grammar/id_format.rs: one more import line, no more logic.
"""
