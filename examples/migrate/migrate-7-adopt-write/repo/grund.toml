grund_config_version = 2

[schema]
marker = "§"
shorthand = "canonical"
id_format = "{kind}-{slug}"
slug_pattern = "[a-z0-9][a-z0-9-]*"
number_pattern = "\\d+"
section_separator = "."
heading_depth = "must"

[schema.sources]
languages = ["v1_markdown", "v1_c_family", "v1_plain", "v1_shell"]
declarations = "any-comment"
exclude = ["target/", "node_modules/", ".git/", "dist/", "build/", ".venv/"]
respect_gitignore = true
fenced = []

[schema.sources.extensions]
md = "v1_markdown"
java = "v1_c_family"
gradle = "v1_plain"
sh = "v1_shell"

[schema.sources.definitions.v1_markdown]
class = "document"
comment_prefixes = ["//", "#", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.sources.definitions.v1_c_family]
class = "source"
comment_prefixes = ["//", "#", "*", "/*"]
doc_comments = "c-family"
docstrings = "off"

[schema.sources.definitions.v1_plain]
class = "source"
comment_prefixes = ["//", "#", "*", "/*"]
doc_comments = "none"
docstrings = "off"

[schema.sources.definitions.v1_shell]
class = "source"
comment_prefixes = ["//", "#", "*", "/*"]
doc_comments = "shell"
docstrings = "off"

[schema.notes.lines]
must = 3
may = 1

[schema.notes.columns]
must = 100

[schema.notes.text]
must = true

[schema.kinds.FS]
folders = ["docs"]
index = false

[schema.kinds.code]
folders = ["src"]

[presentation]
trigger = "$$"
rules = "root"

[presentation.fmt]
anchors = "github"
links = "index"
exclude = []
