name: CI

on:
  push:
    branches: [main]
  pull_request:
  # §AR-ci.12: the merge queue runs this on each group before main moves to it.
  merge_group:
  # §FS-distribution.4.4.1: the release helpers run this on their candidate
  # commits before main moves to them.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # §AR-ci.13.6: no incremental state is written, so none reaches a cargo cache.
  CARGO_INCREMENTAL: 0
  # Treat rustc warnings as errors for the binary itself. NOTE: this does not
  # deny clippy lints — clippy is intentionally not part of CI here. Add a
  # `cargo clippy --no-deps -- -D warnings` step if/when we want lint enforcement.
  RUSTFLAGS: "-D warnings"
  # §FS-distribution.3.0.3: corpus pipes carry UTF-8 on every host.
  PYTHONUTF8: "1"

# §AR-ci.13: each operating system's suites run as jobs of their own, side by side: the
# leg written once in ci-leg.yml and called here per system, never generated by YAML
# anchors. Each OS's required check, `cargo test (<os>)`, is the aggregate that judges it.

# macOS runs once a day in macos.yml and here on a dispatch alone (§AR-ci.14.2).

# §AR-ci.13.6: each job restores its caches first and saves them last, on a push to main
# alone. A cache failure only warns: actions/cache/restore and /save report one as a
# warning and go on, so a job never stops on its cache (§AR-ci).
jobs:
  # §AR-ci.13.1: the ubuntu-latest leg, its jobs those of ci-leg.yml.
  leg-ubuntu:
    name: ubuntu-latest
    uses: ./.github/workflows/ci-leg.yml
    with:
      os: ubuntu-latest

  # `.pre-commit-config.yaml` is the local gate; CI runs it directly so every
  # pre-commit hook remains enforced remotely (§AR-ci.1), less the hooks whose command a
  # job above already runs (§AR-ci.13.3).
  pre-commit:
    name: pre-commit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # §AR-ci.3.1.4: the lychee hook diffs against LINK_BASE, which must be present.
          fetch-depth: 0

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with: { python-version: "3.x" }

      # §AR-ci.13.4: the key names its job, so no job's save is lost to another's exact hit.
      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      # Every binary a hook calls, in this job, before the hooks run (§AR-ci.1).
      - name: Install pre-commit hook dependencies
        run: |
          python -m pip install -q pre-commit
          cargo install lychee --version 0.23.0 --locked --quiet
          cargo install fissile --version 0.8.3 --locked --quiet

      # §AR-ci.3.1.4: a dispatch has no event base, and a fork's origin/main may be weeks
      # stale, so measure from the merge base with the upstream's main.
      - name: Resolve the link gate's base for a dispatch
        id: dispatch_base
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.clone_url // .clone_url' || true)
          # A crash prints nothing; `none` keeps that from falling back to the stale origin/main.
          base=$(python scripts/dispatch_link_base.py "$upstream" || true)
          echo "base=${base:-none}" >> "$GITHUB_OUTPUT"

      - name: pre-commit
        # lychee checks upwards of three thousand links, a large share of them
        # to github.com. Unauthenticated, they share a low per-IP budget with
        # every other job on the runner, and a handful come back 503 - which it
        # reports as "Rejected status code", reading like a dead link rather
        # than a throttle. The links were this repository's own documents, and
        # they resolved in a browser the whole time. lychee reads GITHUB_TOKEN
        # from the environment; the workflow-scoped one is enough, because the
        # point is the authenticated rate limit rather than access to anything
        # private.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # §AR-ci.3.1.2: the same token, as GH_TOKEN, which gh reads first, feeds
          # the hook's `gh api` re-check of a github.com 5xx.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # §AR-ci.3.1.4: the lychee hook requests only the external URLs on lines changed
          # since this base, the one the commit-messages job reads, or a dispatch's upstream
          # merge base; a push to main sets none.
          LINK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || steps.dispatch_base.outputs.base }}
          # §AR-ci.13.3: exactly the hooks whose command the Rust, Python and Node jobs run.
          SKIP: cargo-fmt-check,cargo-build,cargo-test,python-test
        run: pre-commit run --all-files

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}

  # §AR-ci.13.1: the windows-latest leg, its jobs those of ci-leg.yml.
  leg-windows:
    name: windows-latest
    uses: ./.github/workflows/ci-leg.yml
    with:
      os: windows-latest

  # §AR-ci.14.2: a release candidate is judged on macOS too; no other event runs it.
  macos:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/macos-suites.yml

  # §AR-ci.13.2: the required checks. Each runs no suite of its own; it runs whatever its
  # needs did, and fails unless every one of them succeeded.
  test-ubuntu:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [leg-ubuntu, pre-commit, bench-build, bench, bench-record]
    if: always()
    steps:
      - name: every job it needs succeeded
        if: ${{ needs.leg-ubuntu.result != 'success' || needs.pre-commit.result != 'success' || needs.bench-build.result != 'success' || needs.bench.result != 'success' || needs.bench-record.result != 'success' }}
        run: exit 1

  test-windows:
    name: cargo test (windows-latest)
    runs-on: ubuntu-latest
    needs: [leg-windows]
    if: always()
    steps:
      - name: every job it needs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

  # `pre-commit run --all-files` cannot reproduce the `commit-msg` stage — it takes a
  # message file, not a file list — so a trailer that lives only in a commit message
  # rides in unchecked. This job scans what the event adds (§AR-ci.8.2).
  commit-messages:
    name: commit message attribution gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The range endpoints must both be present; a shallow clone has neither.
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with: { python-version: "3.x" }

      - name: scan commit messages
        shell: bash
        env:
          # A pull request scans base..head, so a rewritten or rebased branch is
          # judged on the commits it actually contributes. A push scans what it
          # added; the script narrows to the tip commit when `before` names a
          # commit the runner cannot resolve (first push, force-push).

          # §AR-ci.12: a merge-queue group scans base_sha..head_sha, what it puts on main.
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || github.event_name == 'merge_group'
                && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: python scripts/check_no_claude_attribution.py --range "$RANGE"

  # Instruction-counting benchmarks for the hot CLI commands (§AR-benchmarks / §AR-ci.5),
  # out of the suite jobs because only these need Valgrind: a build job, a shard per leg
  # (§AR-benchmarks.1.2.2), and a record job that merges them (§AR-benchmarks.7.1.1).
  bench-build:
    name: cargo bench (build)
    # §AR-ci.12: a queue group builds its head alone, as a push does, for its shards to hold
    # to the ceilings; the push the queue makes to main records.
    runs-on: ubuntu-latest
    # §AR-ci.5: the count's every input is pinned here and in the shards, and only there. The
    # digest is release.yml's RUST_TOOLCHAIN and its C library; BENCH_IMAGE and every cache
    # key of both jobs repeat it, so change them all together.
    container:
      image: rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      options: --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash
    env:
      BENCH_IMAGE: sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      LC_ALL: C.UTF-8
      TZ: UTC
      RAYON_NUM_THREADS: 4
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bench-cache
        id: cargo

      # §AR-ci.5.1: only the base *binary* comes from the base branch; its harness and
      # fixture generator never run, so a change to either cannot read as a code change.
      - name: Build the base branch's binary
        if: github.event_name == 'pull_request'
        run: |
          # The container runs as root over a workspace the runner owns.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout --force "${{ github.event.pull_request.base.sha }}"
          cargo build --profile bench -p grund --features bench --bin grund --locked --quiet
          install -D target/release/grund bench-bin/base/grund
          git checkout --force "${{ github.sha }}"

      # §AR-ci.5: the head's `grund`, its harness and its `grund-lsp` (§AR-benchmarks.1.7),
      # all with the bench profile.
      - name: Build the head's binaries and the harness
        run: |
          cargo bench -p grund --features bench --locked --quiet --bench instructions --no-run
          cargo build --profile bench -p grund-lsp --locked --quiet
          # A shard's `cargo bench` finds this target fresh and builds nothing; tar keeps the
          # executable bits an artifact drops.
          mkdir -p bench-bin
          tar -cf bench-bin/target.tar --exclude=target/release/incremental target/release
          sha256sum target/release/grund | cut -d' ' -f1 > bench-bin/head-grund.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bench-binaries
          path: bench-bin
          retention-days: 1

      # §AR-ci.13.6: only a push to main saves, after the work.
      - uses: ./.github/actions/bench-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        with:
          save: true

  bench:
    name: cargo bench (shard ${{ matrix.shard }})
    needs: [bench-build]
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one regression does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    # §AR-ci.5: the build job's image and env, so its binaries are measured where they
    # were built.
    container:
      image: rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      # §AR-ci.5: iai-callgrind runs Valgrind under `setarch -R`, with ASLR off, and the
      # default seccomp profile refuses that personality call.
      options: --security-opt seccomp=unconfined
    # bash -eo pipefail, so a check piped into the job summary still fails the step.
    defaults:
      run:
        shell: bash
    env:
      BENCH_IMAGE: sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
      LC_ALL: C.UTF-8
      TZ: UTC
      RAYON_NUM_THREADS: 4
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ""
      # §AR-ci.5.2: every run here is CI's series, held to the catalog's absolute ceilings.
      GRUND_BENCH_CEILINGS: 1
      # §AR-benchmarks.1.2.2: this leg's rows; `7` is the catalog's `shards`.
      GRUND_BENCH_SHARD: ${{ matrix.shard }}/7
    steps:
      - uses: actions/checkout@v6

      # §AR-ci.13.6: one shard saves the registry, on a push to main only.
      - uses: ./.github/actions/bench-shard
        with:
          artifact: bench-binaries
          save-registry: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      # §AR-benchmarks.5.1: a scenario the base binary refuses is left out and listed.
      - name: Save the base binary's baseline under this harness
        if: github.event_name == 'pull_request'
        run: |
          export GRUND_BENCH_BIN="$PWD/bench-bin/base/grund" GRUND_BENCH_REFUSED="$RECORDS/refused.txt"
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-baseline=main --save-summary=json
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/base-${{ matrix.shard }}.json" --binary "$GRUND_BENCH_BIN" --commit "${{ github.event.pull_request.base.sha }}" --refused "$GRUND_BENCH_REFUSED"

      # §AR-benchmarks.7.2: this shard's comparison is printed even when a limit fails the
      # gate, which skips the record job's merged one; the step still fails after it.
      - name: cargo bench regression gate
        if: github.event_name == 'pull_request'
        run: |
          set +e
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --baseline=main --save-summary=json
          gate=$? && set -e
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/head-${{ matrix.shard }}.json"
          python3 scripts/bench_record.py compare "$RECORDS/base-${{ matrix.shard }}.json" "$RECORDS/head-${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$gate"

      # §AR-benchmarks.7.3: a push to main runs the same binary again and holds the bound.
      # A failure on an unchanged binary is a flaky test: file it (`bug`, `flaky-test`).
      - name: cargo bench
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/first-${{ matrix.shard }}.json"
          [ "${{ github.event_name }} ${{ github.ref }}" = "push refs/heads/main" ] || exit 0
          cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json
          python3 scripts/bench_record.py record --environment ci --tier pr --out "$RECORDS/second-${{ matrix.shard }}.json"
          python3 scripts/bench_record.py jitter "$RECORDS/first-${{ matrix.shard }}.json" "$RECORDS/second-${{ matrix.shard }}.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # §AR-ci.5.1, §AR-ci.12: a merge-queue group runs its head once, held to the ceilings
      # alone; it measures no base, compares nothing and records nothing.
      - if: github.event_name == 'merge_group'
        run: cargo bench -p grund --features bench --locked --quiet --bench instructions -- --save-summary=json

      # §AR-ci.5: the harness measured the build job's binary; a shard that rebuilt it fails.
      - uses: ./.github/actions/bench-built

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-records-${{ matrix.shard }}
          path: |
            target/iai/**/summary.json
            bench-records/*.json

  bench-record:
    name: cargo bench (record)
    needs: [bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: bench-records-*
          path: shards

      # §AR-benchmarks.7.1.1: one record per revision, merged from every shard's partial; a
      # merge that refuses fails the job. A queue group merges and uploads none (§AR-ci.12).
      - name: Merge the shards' records and compare
        if: github.event_name != 'merge_group'
        shell: bash
        run: |
          merge() { mkdir -p records && python3 scripts/bench_record.py merge --out "records/$1.json" shards/*/bench-records/"$1"-*.json; }
          if [ "${{ github.event_name }}" != pull_request ]; then merge first; exit; fi
          merge base && merge head
          python3 scripts/bench_record.py compare records/base.json records/head.json | tee -a "$GITHUB_STEP_SUMMARY"

      - if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: iai-callgrind-summaries
          path: records/*.json
