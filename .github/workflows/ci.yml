            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      # §AR-ci.13.7: one shard of the cargo suite; rust-ubuntu runs the leg's other
      # Rust checks.
      - name: cargo test
        run: python scripts/run_cargo_suite.py --shard 3/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}

  rust-ubuntu-4:
    name: rust (ubuntu-latest) 4/4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to a tagged release rather than @master so a compromise of the
      # action repo doesn't silently change CI behavior on unrelated PRs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with: { python-version: "3.x" }

      # §AR-ci.13.4: the key names its job, so no job's save is lost to another's exact hit.
      - name: Restore cargo registry and target
        id: cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-
            ${{ runner.os }}-cargo-

      # §AR-ci.13.7: one shard of the cargo suite; rust-ubuntu runs the leg's other
      # Rust checks.
      - name: cargo test
        run: python scripts/run_cargo_suite.py --shard 4/4 --workspace --all-targets --locked --features grund/test-workspace-load-count

      # §AR-ci.13.6: only a push to main saves, after the work and without what every
      # run rebuilds from its own sources.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        run: bash scripts/prune_cargo_cache.sh

      - name: Save cargo registry and target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
