grund_config_version = 1

[reference]
strict = true

[id]
format = "{kind}-{slug}"
named_sections = true

[[kinds]]
kind = "AR"
folder = "docs/ar"
index = false

[[kinds]]
kind = "RULE"
folder = "docs/rules"
index = false
rules = true

[scan]
include = ["docs", "src"]
extensions = ["md", "rs", "java", "rb", "sql", "lisp", "py"]
