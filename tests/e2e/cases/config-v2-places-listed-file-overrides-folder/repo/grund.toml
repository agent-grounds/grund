grund_config_version = 2
project_name = "example"
[schema.sources]
languages = ["markdown"]
[schema.kinds.GOAL]
files = ["goals.md"]
[schema.kinds.FS]
files = ["requirements.md"]
[schema.kinds.code]
folders = ["crates"]
[schema.kinds.page]
citable = false
files = ["crates/grund/README.md"]
[rules.citations.code]
must-not = ["GOAL"]
[rules.citations.page]
must = ["FS"]
