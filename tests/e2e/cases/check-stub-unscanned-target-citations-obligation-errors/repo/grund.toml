grund_config_version = 1

[reference]
strict = true
require_grounding = false

[id]
format = "{kind}-{slug}"
named_sections = true

[[kinds]]
kind = "GOAL"
folder = "docs/goals"
index = false

[[kinds]]
kind = "FS"
folder = "docs/fs"
index = false

[citations]
default = "may"

[citations.FS]
must = ["GOAL"]

[scan]
include = ["docs"]
