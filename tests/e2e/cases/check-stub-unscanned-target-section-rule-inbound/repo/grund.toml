grund_config_version = 1

[reference]
strict = true
require_grounding = false

[id]
format = "{kind}-{slug}"
named_sections = true

[[kinds]]
kind = "FS"
folder = "docs/fs"
index = false

[[kinds]]
kind = "AR"
folder = "docs/ar"
index = false

[[kinds]]
kind = "RULE"
folder = "docs/rules"
index = false
rules = true

[scan]
include = ["docs"]
