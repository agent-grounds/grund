match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 604, unit = "lines" }
until = "the classification cases move to a scanner-side test file of their own"
reason = """
The render half of this file moved out to what is now `templates/tests_citation_directions.rs`, which took it from 659 lines to 551. What is left is the rule half: how the scanner classifies a citing site, the obligation and prohibition passes over those classes, the empty-obligation warning, and config validation. Missing boundary: classification and enforcement are two subjects — the first is scanner behaviour that citation directions happen to consume, the second is the checker's — and a scanner-side file would take the first with it.

The ceiling moved 551 -> 604 when the file went beside the code it pins (§AR-core-module-layout.1), and none of it is a case: one net line for the import block a module charges over the `include!` wrapper it drops, and fifty-two for `cargo fmt --all` reaching the file for the first time now that it is a module rather than spliced in — this was the widest of the flat modules, so it carried the most over-long expressions the formatter had never seen.
"""
